name: Weekly Geomatics News

on:
  schedule:
    # GitHub Actions 使用 UTC；北京时间每周一 09:00 对应 UTC 01:00。
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect, score and report
        run: python src/geomatics_news.py run --since-days 8

      - name: Commit weekly report and database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "chore: update weekly geomatics news"
          git push

