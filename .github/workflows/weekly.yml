name: Weekly Geomatics News

on:
  schedule:
    # UTC：北京时间周一 09:17 首次运行，11:47 / 15:23 检查补跑。
    # 避开整点；schedule 仍可能延迟，不能保证准时。
    - cron: "17 1 * * 1"
    - cron: "47 3 * * 1"
    - cron: "23 7 * * 1"
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

permissions:
  contents: write

concurrency:
  group: weekly-geomatics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Re-runs must collect with the latest source configuration and database.
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Check whether today's report needs generating
        id: due
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          report="reports/weekly-$(TZ=Asia/Shanghai date +%F).md"
          # Ubuntu runner includes Python 3; this helper uses only its standard library.
          due=$(python3 scripts/report_due.py)
          if [ "$TRIGGER_EVENT" = "schedule" ] && [ "$due" = "false" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Today's report has complete source coverage. Scheduled backup skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Generating report: $report (trigger: $TRIGGER_EVENT)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Python
        if: steps.due.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.due.outputs.run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Verify source parsing and date filters
        if: steps.due.outputs.run == 'true'
        run: python -m unittest discover -s tests -v

      - name: Check ministry DNS and try HTTPS DNS if needed
        if: steps.due.outputs.run == 'true'
        shell: bash
        run: |
          if timeout 15s getent ahostsv4 www.mnr.gov.cn; then
            echo "Ministry DNS resolved normally."
          else
            echo "Default resolver failed; querying public DNS over HTTPS."
            python scripts/resolve_mnr.py > "$RUNNER_TEMP/mnr-hosts"
            if [ -s "$RUNNER_TEMP/mnr-hosts" ]; then
              sudo tee -a /etc/hosts < "$RUNNER_TEMP/mnr-hosts"
            fi
            if ! timeout 15s getent ahostsv4 www.mnr.gov.cn; then
              echo "::warning::Ministry DNS remains unavailable. Other official sources will still be collected."
            fi
          fi

      - name: Collect, score and report
        if: steps.due.outputs.run == 'true'
        run: python src/geomatics_news.py run --since-days 8 --limit 30

      - name: Save report and database as downloadable backup
        if: steps.due.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: geomatics-news-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/
            data/news.db
          retention-days: 30

      - name: Show source coverage in run summary
        if: steps.due.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          health = json.loads(Path('reports/health.json').read_text(encoding='utf-8'))
          failed = [s['name'] for s in health['sources'] if s['status'] != '正常']
          text = '采集覆盖不完整：' + '、'.join(failed) if failed else '本次启用来源均读取正常（不代表全网覆盖）。'
          if failed:
              print('::warning::' + text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('\n' + text + '\n')
          PY

      - name: Commit weekly report and database
        if: steps.due.outputs.run == 'true'
        env:
          REPORT_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          git commit -m "chore: update weekly geomatics news"
          for attempt in 1 2 3; do
            git fetch origin "$REPORT_BRANCH"
            if ! git rebase "origin/$REPORT_BRANCH"; then
              git rebase --abort
              echo "Concurrent data edits conflict. Download the report backup from this run."
              exit 1
            fi
            if git push origin "HEAD:refs/heads/$REPORT_BRANCH"; then
              exit 0
            fi
          done
          echo "Could not upload after 3 attempts. Download the report backup from this run."
          exit 1

