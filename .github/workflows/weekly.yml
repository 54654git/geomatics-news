name: Weekly Geomatics News

on:
  schedule:
    # Beijing Mon-Wed 08:17, 10:47, 13:23. Tue/Wed can catch up the same week.
    - cron: "17 0 * * 1-3"
    - cron: "47 2 * * 1-3"
    - cron: "23 5 * * 1-3"
  workflow_dispatch:
    inputs:
      force:
        description: "Force regeneration even if this period is complete"
        type: boolean
        default: false
      week_of:
        description: "Optional report Monday (YYYY-MM-DD); blank = current week"
        type: string
        default: ""

env:
  TZ: Asia/Shanghai
permissions:
  contents: write
concurrency:
  group: weekly-geomatics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout latest branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Check report period and bounded retry
        id: due
        env:
          FORCE: ${{ inputs.force }}
          WEEK_OF: ${{ inputs.week_of }}
        shell: bash
        run: |
          period=$(python3 -c 'import os; from src.periods import report_period; print(report_period(week_of=os.environ.get("WEEK_OF") or None)["id"])')
          args=(--week-of "$period")
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          due=$(python3 scripts/report_due.py "${args[@]}")
          echo "period=$period" >> "$GITHUB_OUTPUT"
          echo "run=$due" >> "$GITHUB_OUTPUT"
          echo "Report period: $period; regeneration: $due; force: ${FORCE:-false}" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        if: steps.due.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies and test
        if: steps.due.outputs.run == 'true'
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v

      - name: Verify ministry route in disposable runner only
        if: steps.due.outputs.run == 'true'
        shell: bash
        run: |
          if curl --fail --silent --head --connect-timeout 5 --max-time 12 https://www.mnr.gov.cn/dt/ch/ > /dev/null; then
            echo "Ministry HTTPS route available."
          else
            python scripts/resolve_mnr.py > "$RUNNER_TEMP/mnr-hosts"
            if [ -s "$RUNNER_TEMP/mnr-hosts" ]; then sudo tee -a /etc/hosts < "$RUNNER_TEMP/mnr-hosts"; fi
          fi

      - name: Collect and generate fixed-period report
        if: steps.due.outputs.run == 'true'
        env:
          PERIOD: ${{ steps.due.outputs.period }}
        run: python src/geomatics_news.py run --week-of "$PERIOD" --limit 15

      - name: Save report and database backup
        if: steps.due.outputs.run == 'true' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: geomatics-news-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/
            data/news.db
          retention-days: 30

      - name: Commit report and database
        if: steps.due.outputs.run == 'true' && success()
        env:
          REPORT_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: publish fixed-period marine surveying digest"
          for attempt in 1 2 3; do
            git fetch origin "$REPORT_BRANCH"
            if ! git rebase "origin/$REPORT_BRANCH"; then
              git rebase --abort
              echo "::error::Concurrent data conflict. Use the artifact backup."
              exit 1
            fi
            if git push origin "HEAD:refs/heads/$REPORT_BRANCH"; then exit 0; fi
          done
          exit 1

      - name: Show delivery and coverage status
        if: always() && !cancelled()
        env:
          EXPECTED_PERIOD: ${{ steps.due.outputs.period }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path=Path('reports/health.json')
          if not path.exists():
              raise SystemExit('No health record; report delivery unverified.')
          h=json.loads(path.read_text(encoding='utf-8'))
          if h.get('period_id') != os.environ['EXPECTED_PERIOD']:
              raise SystemExit('Report period is stale or missing; delivery not verified.')
          core=[s['name'] for s in h['sources'] if s['status']!='正常' and not s.get('optional')]
          optional=[s['name'] for s in h['sources'] if s['status']!='正常' and s.get('optional')]
          text=f"Period {h.get('period_id')}; selected {h['selected']}; core complete {h['complete']}; attempts {h.get('attempts')}."
          if core: text+=' Core missing: '+', '.join(core)
          if optional: text+=' Optional degraded: '+', '.join(optional)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:f.write('\n'+text+'\n')
          if core:
              print('::error::'+text)
              raise SystemExit(1)
          if optional:print('::warning::'+text)
          PY
