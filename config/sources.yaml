# 国内来源直接读取公开列表页或官方 RSS，不依赖 GDELT。
# GDELT 国内检索保留为可选备用；今日头条仅可间接检索，不保证覆盖。
sources:
- id: cnr_tech
  name: 央广网·科技（直接采集）
  type: html
  url: https://www.cnr.cn/tech/techds/
  article_url_pattern: /20\d{6}/t\d+_\d+\.shtml
  allowed_domains:
  - cnr.cn
  required_terms: &id001
  - 海洋测绘
  - 海道测量
  - 水深
  - 测深
  - 多波束
  - 声呐
  - 海底地形
  - 海图
  - 测绘
  - 地理信息
  - 遥感
  - 北斗
  - 激光雷达
  - 摄影测量
  - 卫星
  - 点云
  - 导航
  - 南极
  - 海洋信息
  - 十五五
  - 海洋强国
  - 海洋经济
  - 海洋科技
  - 海洋生态
  - 海洋观测
  - 海岸带
  - 海洋空间规划
  - 海岛空间
  - 海洋数据
  - 海底
  - 水声
  - 数字孪生
  - 无人船
  - AUV
  - S-100
  - S-102
  tags:
  - 国内媒体
  - 科技
  max_items: 12
  request_interval: 1
  enabled: true
- id: xinhua_tech
  name: 新华网·科技（直接采集）
  type: html
  url: https://www.news.cn/tech/
  article_url_pattern: /tech/20\d{6}/[a-zA-Z0-9]+/c\.html
  allowed_domains:
  - news.cn
  - xinhuanet.com
  required_terms: *id001
  tags:
  - 国内媒体
  - 科技
  max_items: 12
  request_interval: 1
  enabled: true
- id: mnr_surveying
  name: 自然资源部·测绘（直接采集）
  type: html
  url: https://www.mnr.gov.cn/dt/ch/
  article_url_pattern: /20\d{4}/t\d+_\d+\.html
  allowed_domains:
  - mnr.gov.cn
  required_terms: *id001
  tags:
  - 官方
  - 测绘
  max_items: 12
  request_interval: 1
  enabled: true
- id: mnr_ocean
  name: 自然资源部·海洋（直接采集）
  type: html
  url: https://www.mnr.gov.cn/dt/hy/
  article_url_pattern: /20\d{4}/t\d+_\d+\.html
  allowed_domains:
  - mnr.gov.cn
  required_terms: *id001
  tags:
  - 官方
  - 海洋
  max_items: 12
  request_interval: 1
  enabled: true
- id: glut_news
  name: 桂林理工大学·桂工要闻（直接采集）
  type: html
  url: https://www.glut.edu.cn/ggyw.htm
  article_url_pattern: /info/1073/\d+\.htm
  allowed_domains:
  - glut.edu.cn
  required_terms: *id001
  tags:
  - 高校
  - 测绘科研
  max_items: 12
  request_interval: 1
  enabled: true
  date_xpath: //span[contains(text(),'发布时间')]
- id: cas_research
  name: 中国科学院·科研进展（直接采集）
  type: html
  url: https://www.cas.cn/syky/
  article_url_pattern: /syky/20\d{4}/t\d+_\d+\.shtml
  allowed_domains:
  - cas.cn
  required_terms: *id001
  tags:
  - 科研院所
  - 科研进展
  max_items: 12
  request_interval: 1
  enabled: true
- id: chinanews_rss
  name: 中国新闻网·即时新闻 RSS
  type: rss
  url: https://www.chinanews.com.cn/rss/scroll-news.xml
  required_terms: *id001
  tags:
  - 国内媒体
  max_items: 100
  enabled: true
- id: nmdis_news
  name: 国家海洋信息中心（直接采集）
  type: html
  url: https://www.nmdis.org.cn/
  article_url_pattern: /c/20\d{2}-\d{2}-\d{2}/\d+\.shtml
  allowed_domains:
  - nmdis.org.cn
  required_terms: *id001
  date_xpath: //em[contains(text(),'发布时间')]
  tags:
  - 官方
  - 海洋数据与规划
  max_items: 12
  request_interval: 1
  enabled: true
- id: fio_research
  name: 自然资源部第一海洋研究所·科研动态
  type: html
  url: https://www.fio.org.cn/science/xue-shu-huo-dong-list-0.htm
  article_url_pattern: /science/xshd-detail-\d+\.htm
  allowed_domains:
  - fio.org.cn
  required_terms: *id001
  tags:
  - 官方科研院所
  - 青岛海洋科研
  max_items: 10
  request_interval: 1
  enabled: true
- id: noaa_coast_survey
  name: NOAA 海岸测量办公室（官方 RSS）
  type: rss
  url: https://nauticalcharts.noaa.gov/updates/feed/
  tags:
  - 官方
  - 海道测量
  max_items: 20
  enabled: true
- id: gebco_news
  name: GEBCO 海底测绘与数据（官方 RSS）
  type: rss
  url: https://www.gebco.net/news.xml
  tags:
  - 官方项目
  - 海底地形与数据
  max_items: 20
  enabled: true
- id: seabed2030_news
  name: Seabed 2030 全球海底测绘项目（官方 RSS）
  type: rss
  url: https://seabed2030.org/feed/
  tags:
  - 官方项目
  - 全球海底测绘
  max_items: 20
  enabled: true
- id: gdelt_cn_marine
  name: GDELT 中文海洋测绘新闻（备用，默认关闭）
  type: gdelt
  query: ("海洋测绘" OR "海道测量" OR "水深测量" OR "多波束测深" OR "声呐测深" OR "海底地形")
  language: Chinese
  required_terms:
  - 海洋测绘
  - 海道测量
  - 水深
  - 测深
  - 多波束
  - 声呐
  - 海底地形
  - 海图
  tags:
  - 海洋测绘
  - 海洋
  - 水深测量
  - 多波束
  - 声呐
  max_items: 15
  max_content_items: 5
  enabled: false
- id: gdelt_cn_geomatics
  name: GDELT 中文测绘与地理信息新闻（备用，默认关闭）
  type: gdelt
  query: ("测绘" OR "地理信息" OR "遥感" OR "北斗" OR "激光雷达" OR "摄影测量")
  language: Chinese
  required_terms:
  - 测绘
  - 地理信息
  - 遥感
  - 北斗
  - 激光雷达
  - 摄影测量
  tags:
  - 测绘
  - 地理信息
  - 遥感
  - 北斗
  max_items: 15
  max_content_items: 5
  enabled: false
- id: gdelt_en_marine
  name: GDELT 国际海洋测绘新闻（限流备用，默认关闭）
  type: gdelt
  query: ("hydrographic survey" OR bathymetry OR multibeam OR sonar OR "ocean mapping" OR AUV)
  language: English
  required_terms:
  - hydrographic
  - bathymetry
  - multibeam
  - sonar
  - mapping
  - underwater
  - AUV
  - nautical chart
  tags:
  - 海洋测绘
  - hydrographic survey
  - bathymetry
  - multibeam
  max_items: 15
  max_content_items: 5
  enabled: false
- id: gdelt_en_ocean_policy
  name: GDELT 国际海洋规划与标准新闻（限流备用，默认关闭）
  type: gdelt
  query: ("Ocean Decade" OR "UN Decade of Ocean Science" OR "IHO S-100" OR "S-102" OR "Seabed 2030" OR GEBCO OR EMODnet OR "Digital Twin Ocean" OR "blue economy" OR "marine spatial planning")
  language: English
  required_terms:
  - Ocean Decade
  - IHO
  - S-100
  - S-102
  - Seabed 2030
  - GEBCO
  - EMODnet
  - Digital Twin Ocean
  - blue economy
  - marine spatial planning
  tags:
  - 国际规划
  - 海洋标准
  - 海洋测绘
  - 未来方向
  max_items: 12
  max_content_items: 5
  enabled: false
