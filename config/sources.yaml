  - 海洋测绘
  - 测绘
  - 水深
  - 测深
  - 激光雷达
  - 遥感
  - 北斗
  - 摄影测量
  - 多波束
  tags:
  - 国内高校
  - 科研院所
  - 测绘
  - 海洋测绘
  - 激光雷达
  max_items: 20
  max_content_items: 6
  enabled: false
- id: gdelt_cn_major_media
  name: GDELT 国内大型媒体测绘科技新闻（备用，默认关闭）
  type: gdelt
  query: (domain:cnr.cn OR domain:toutiao.com OR domain:news.cn OR domain:people.com.cn OR domain:cctv.com OR domain:chinanews.com.cn) ("海洋测绘" OR "测绘" OR "水深" OR
